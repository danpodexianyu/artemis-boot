server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql:///artemis_boot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 123456

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.artemis.boot.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

artemis:
  cors:
    # 跨域允许的来源白名单, 逗号分隔; 生产环境必须替换为真实前端域名
    # 示例: https://app.example.com,https://admin.example.com
    # 留空时默认放行本地开发地址 (localhost:3000)
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  jwt:
    secret: 'sf5kFIHttT7kqZ3ceF79TMYlh8H6ZvMBQm0gP0qR6HU='
    expire: 3600

